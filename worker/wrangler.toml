name = "virtsutunn-booking"
main = "src/index.js"
compatibility_date = "2025-09-01"

[vars]
ALLOWED_ORIGINS = "https://virtsutynn.ee,https://www.virtsutynn.ee"

# Max 5 booking posts per IP per minute.
[[ratelimits]]
name = "BOOKING_LIMITER"
namespace_id = "1001"
simple = { limit = 5, period = 60 }

# Secrets (set with `npx wrangler@4 secret put <NAME>`, never commit them):
#   TELEGRAM_BOT_TOKEN
#   TELEGRAM_CHAT_ID
